name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          publish=false
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
            git fetch origin main
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
            publish=true
          fi
          printf 'version=%s\npublish=%s\n' "$version" "$publish" >> "$GITHUB_OUTPUT"
      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

  build:
    name: Build and test Windows binaries
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Production owner integration tests
        run: cargo test -p spotter-svc --all-targets --features test-support --locked
      - name: Build release binaries
        run: cargo build -p spotter-svc -p spotter-cli --release --locked --target x86_64-pc-windows-msvc
      - name: Stage exact binary inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'target/x86_64-pc-windows-msvc/release'
          $stage = 'release-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $files = @('spotter-svc.exe', 'spotter-cli.exe', 'spotter_svc.pdb', 'spotter_cli.pdb')
          foreach ($file in $files) {
            $path = Join-Path $source $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing release artifact: $path" }
            Copy-Item -LiteralPath $path -Destination $stage
          }
          $actual = @(Get-ChildItem -LiteralPath $stage -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @($files | Sort-Object)
          if (Compare-Object $actual $expected) { throw 'release-stage inventory differs from the closed expected set' }
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          path: release-stage/*
          if-no-files-found: error

  package:
    name: Package MSI and SBOMs
    needs: [verify, build]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binaries
          path: release-stage
      - name: Verify downloaded inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('spotter-svc.exe', 'spotter-cli.exe', 'spotter_svc.pdb', 'spotter_cli.pdb') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath release-stage -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $actual $expected) { throw 'downloaded binary inventory differs from the closed expected set' }
      - name: Install packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.0
          wix --version
          cargo install cargo-cyclonedx --locked
      - name: Generate SBOMs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-stage/sbom | Out-Null
          cargo cyclonedx --manifest-path spotter-svc/Cargo.toml --format json
          cargo cyclonedx --manifest-path spotter-cli/Cargo.toml --format json
          Move-Item spotter-svc/spotter-svc.cdx.json release-stage/sbom/spotter-svc.cdx.json
          Move-Item spotter-cli/spotter-cli.cdx.json release-stage/sbom/spotter-cli.cdx.json
      - name: Build MSI from staged binaries
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Resolve-Path release-stage).Path
          dotnet build installer/Product.wixproj -c Release -p:Platform=x64 -p:ProductVersion=$env:RELEASE_VERSION -p:StageDir="$stage"
          $msi = Get-ChildItem installer/bin -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'WiX did not produce an MSI' }
          New-Item -ItemType Directory -Force packaged | Out-Null
          Copy-Item $msi.FullName "packaged/SnipeSpotter-$env:RELEASE_VERSION-x64.msi"
          Compress-Archive -Path release-stage/* -DestinationPath "packaged/SnipeSpotter-$env:RELEASE_VERSION-x64-symbols.zip"
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-release
          path: packaged/*
          if-no-files-found: error

  lifecycle:
    name: Validate MSI lifecycle on elevated Windows
    needs: [verify, package]
    uses: ./.github/workflows/elevated-windows.yml
    with:
      artifact_name: packaged-release
      msi_name: SnipeSpotter-${{ needs.verify.outputs.version }}-x64.msi
      source_artifact: false
      force: true
      run_identity: release-${{ github.run_id }}-${{ github.run_attempt }}
      log_artifact_name: msi-lifecycle-logs

  aggregate:
    name: Aggregate and validate release inventory
    needs: [verify, package, lifecycle]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packaged-release
          path: dist
      - name: Generate checksums and inventory
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/SnipeSpotter-${RELEASE_VERSION}-x64.msi"
          test -f "dist/SnipeSpotter-${RELEASE_VERSION}-x64-symbols.zip"
          (cd dist && sha256sum SnipeSpotter-* > SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Upload closed release inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inventory
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, aggregate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required by GitHub artifact provenance attestation.
      contents: read
      attestations: write # Required to publish the provenance attestation.
    steps:
      - name: Download release inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inventory
          path: dist
      - name: Attest artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

  publish:
    name: Publish GitHub release
    if: needs.verify.outputs.publish == 'true'
    needs: [verify, aggregate, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the verified GitHub release.
    steps:
      - name: Download release inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inventory
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --draft=false
