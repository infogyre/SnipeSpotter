name: elevated Windows lifecycle

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact containing the MSI to validate.
        required: false
        type: string
        default: packaged-release
      source_artifact:
        description: Build and package a source MSI when true instead of downloading one.
        required: false
        type: boolean
        default: false
      force:
        description: Run the lifecycle lane even when the caller is not path-relevant.
        required: false
        type: boolean
        default: false
      run_identity:
        description: Unique identity used for logs and cleanup diagnostics.
        required: true
        type: string
      msi_name:
        description: Exact MSI filename within the downloaded artifact.
        required: false
        type: string
        default: ''
      log_artifact_name:
        description: Artifact name for lifecycle diagnostics.
        required: true
        type: string
    outputs:
      lifecycle_result:
        description: Result of the MSI lifecycle validation.
        value: ${{ jobs.lifecycle.outputs.lifecycle_result }}

permissions:
  contents: read

jobs:
  lifecycle:
    name: Install, verify, and uninstall MSI
    runs-on: windows-latest
    outputs:
      lifecycle_result: ${{ steps.result.outputs.lifecycle_result }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and assert Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
          if ((rustc --version) -notmatch '^rustc 1\.98\.1 ') { throw "unexpected rustc version: $(rustc --version)" }
      - name: Validate workflow inputs
        id: validate_inputs
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          LOG_ARTIFACT_NAME: ${{ inputs.log_artifact_name }}
          RUN_IDENTITY: ${{ inputs.run_identity }}
          MSI_NAME: ${{ inputs.msi_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/TestSupport/WorkflowInputs.psm1') -Force
          $validated = Get-WorkflowInputContract -ArtifactName $env:ARTIFACT_NAME -LogArtifactName $env:LOG_ARTIFACT_NAME -RunIdentity $env:RUN_IDENTITY -MsiName $env:MSI_NAME
          @(
            "artifact_name=$($validated.artifact_name)"
            "log_artifact_name=$($validated.log_artifact_name)"
            "run_identity=$($validated.run_identity)"
            "msi_name=$($validated.msi_name)"
          ) | Set-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Download packaged MSI
        if: ${{ !inputs.source_artifact }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.validate_inputs.outputs.artifact_name }}
          path: packaged
      - name: Build source MSI
        if: ${{ inputs.source_artifact }}
        shell: pwsh
        env:
          RUN_IDENTITY: ${{ steps.validate_inputs.outputs.run_identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p spotter-svc -p spotter-cli --release --locked --target x86_64-pc-windows-msvc
          $stage = Join-Path $env:RUNNER_TEMP "snipespotter-$env:RUN_IDENTITY-stage"
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'sbom') | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/spotter-svc.exe $stage
          Copy-Item target/x86_64-pc-windows-msvc/release/spotter-cli.exe $stage
          Copy-Item target/x86_64-pc-windows-msvc/release/spotter_svc.pdb $stage
          Copy-Item target/x86_64-pc-windows-msvc/release/spotter_cli.pdb $stage
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ((cargo cyclonedx --version) -ne 'cargo-cyclonedx 0.5.9') { throw "unexpected cargo-cyclonedx version: $(cargo cyclonedx --version)" }
          cargo cyclonedx --manifest-path spotter-svc/Cargo.toml --format json
          cargo cyclonedx --manifest-path spotter-cli/Cargo.toml --format json
          Move-Item spotter-svc/spotter-svc.cdx.json (Join-Path $stage 'sbom/spotter-svc.cdx.json')
          Move-Item spotter-cli/spotter-cli.cdx.json (Join-Path $stage 'sbom/spotter-cli.cdx.json')
          $expectedStageFiles = @(
            'spotter-svc.exe',
            'spotter-cli.exe',
            'spotter_svc.pdb',
            'spotter_cli.pdb',
            'sbom/spotter-svc.cdx.json',
            'sbom/spotter-cli.cdx.json'
          ) | Sort-Object
          $actualStageFiles = @(
            Get-ChildItem -LiteralPath $stage -Recurse -File |
              ForEach-Object { $_.FullName.Substring($stage.Length + 1).Replace('\', '/') }
          ) | Sort-Object
          if (Compare-Object $actualStageFiles $expectedStageFiles) {
            throw 'source-artifact stage inventory differs from the closed expected set'
          }
          dotnet tool install --global wix --version 6.0.0
          if ((wix --version) -notmatch '^6\.0\.0') { throw "unexpected WiX version: $(wix --version)" }
          Remove-Item -LiteralPath installer/bin, installer/obj -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force packaged | Out-Null
          $msi = Join-Path (Resolve-Path -LiteralPath packaged).Path "SnipeSpotter-$env:RUN_IDENTITY-x64.msi"
          $stageDir = (Resolve-Path -LiteralPath $stage).Path
          dotnet build installer/Product.wixproj -c Release -p:Platform=x64 -p:ProductVersion=0.1.0 "-p:StageDir=$stageDir"
          $builtMsis = @(Get-ChildItem installer/bin -Recurse -Filter '*.msi' -File)
          if ($builtMsis.Count -ne 1) { throw 'WiX must produce exactly one MSI' }
          Copy-Item -LiteralPath $builtMsis[0].FullName -Destination $msi
          $packagedMsis = @(Get-ChildItem -LiteralPath packaged -Filter '*.msi' -File)
          if ($packagedMsis.Count -ne 1 -or $packagedMsis[0].FullName -ne $msi) {
            throw 'source-artifact package inventory must contain exactly the MSI consumed by validation'
          }
      - name: Validate MSI lifecycle
        id: validate
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.validate_inputs.outputs.msi_name }}
          RUN_IDENTITY: ${{ steps.validate_inputs.outputs.run_identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/TestSupport/WorkflowPaths.psm1') -Force
          # Producer-consumer contract: exactly one MSI under packaged must
          # exist here and must be the validated file.
          $packagedMsis = @(Get-ChildItem -LiteralPath packaged -Filter '*.msi' -File)
          if ($packagedMsis.Count -ne 1) { throw 'packaged must contain exactly one MSI for validation' }
          $msiPath = Resolve-ValidatedMsiPath -Root (Join-Path (Get-Location) 'packaged') -RequestedName $env:MSI_NAME
          if ($packagedMsis[0].FullName -ne $msiPath) { throw 'packaged MSI does not match the validated name' }
          ./scripts/test-msi-lifecycle.ps1 -MsiPath $msiPath
      - name: Stage direct SCM service executable
        shell: pwsh
        env:
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          RUN_IDENTITY: ${{ steps.validate_inputs.outputs.run_identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packaged = (Resolve-Path -LiteralPath packaged).Path
          $serviceSource = if ($env:SOURCE_ARTIFACT -eq 'true') {
            Join-Path (Get-Location) 'target/x86_64-pc-windows-msvc/release/spotter-svc.exe'
          } else {
            $symbols = @(Get-ChildItem -LiteralPath $packaged -Filter '*-symbols.zip' -File)
            if ($symbols.Count -ne 1) { throw "expected exactly one release symbols archive in $packaged" }
            $extract = Join-Path $env:RUNNER_TEMP "snipespotter-direct-$env:RUN_IDENTITY-symbols"
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            Expand-Archive -LiteralPath $symbols[0].FullName -DestinationPath $extract -Force
            Join-Path $extract 'spotter-svc.exe'
          }
          if (-not (Test-Path -LiteralPath $serviceSource -PathType Leaf)) {
            throw "direct SCM service executable was not staged: $serviceSource"
          }
          if ([int64](Get-Item -LiteralPath $serviceSource -Force).Length -le 0) {
            throw "direct SCM service executable is empty: $serviceSource"
          }
          $servicePath = Join-Path $packaged 'spotter-svc.exe'
          Copy-Item -LiteralPath $serviceSource -Destination $servicePath -Force
          if (-not (Test-Path -LiteralPath $servicePath -PathType Leaf)) {
            throw "direct SCM service executable copy is missing: $servicePath"
          }
          if ([int64](Get-Item -LiteralPath $servicePath -Force).Length -le 0) {
            throw "direct SCM service executable copy is empty: $servicePath"
          }
      - name: Build direct SCM test-support CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p spotter-cli --features test-support --release --locked --target x86_64-pc-windows-msvc
          $source = 'target/x86_64-pc-windows-msvc/release/spotter-cli.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "test-support CLI was not built: $source" }
          Copy-Item -LiteralPath $source -Destination (Join-Path (Resolve-Path -LiteralPath packaged).Path 'spotter-cli-test-support.exe')
      - name: Validate direct CLI SCM lifecycle
        id: direct_scm
        shell: pwsh
        env:
          RUN_IDENTITY: ${{ steps.validate_inputs.outputs.run_identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cliPath = Join-Path (Resolve-Path -LiteralPath packaged).Path 'spotter-cli-test-support.exe'
          $servicePath = Join-Path (Resolve-Path -LiteralPath packaged).Path 'spotter-svc.exe'
          $directDataRoot = Join-Path $env:RUNNER_TEMP "snipespotter-direct-$env:RUN_IDENTITY-data"
          ./scripts/test-direct-scm-lifecycle.ps1 -CliPath $cliPath -ServicePath $servicePath -RunIdentity $env:RUN_IDENTITY -DataRoot $directDataRoot -LogDirectory (Join-Path $env:RUNNER_TEMP 'snipespotter-msi-logs')
      - name: Capture bounded lifecycle diagnostics
        if: ${{ always() && steps.validate_inputs.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP 'snipespotter-msi-logs'
          New-Item -ItemType Directory -Force -Path $diagnosticRoot | Out-Null
          $service = Get-Service -Name 'SnipeSpotter' -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            'service=absent' | Set-Content -LiteralPath (Join-Path $diagnosticRoot 'service.txt')
          } else {
            "service=$($service.Status)" | Set-Content -LiteralPath (Join-Path $diagnosticRoot 'service.txt')
          }
          Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'MsiInstaller|SnipeSpotter' } |
            Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName |
            ConvertTo-Json -Depth 2 |
            Set-Content -LiteralPath (Join-Path $diagnosticRoot 'application-events.json')
          # Capture the service's own tracing log files for root-cause analysis.
          $logDir = Join-Path $env:ProgramData 'infogyre\SnipeSpotter\logs'
          if (Test-Path -LiteralPath $logDir) {
            Get-ChildItem -LiteralPath $logDir -Filter '*.log' -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                $content = Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
                if ($content) {
                  $dest = Join-Path $diagnosticRoot $_.Name
                  # Cap at 32 KB to avoid uploading unbounded logs.
                  if ($content.Length -gt 32768) {
                    $content = $content.Substring(0, 32768) + '...[truncated]'
                  }
                  Set-Content -LiteralPath $dest -Value $content
                }
              }
          }
      - name: Publish lifecycle result
        id: result
        if: always()
        env:
          MSI_OUTCOME: ${{ steps.validate.outcome }}
          DIRECT_SCM_OUTCOME: ${{ steps.direct_scm.outcome }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msiPassed = $env:MSI_OUTCOME -eq 'success'
          $directScmPassed = $env:DIRECT_SCM_OUTCOME -eq 'success'
          $result = if ($msiPassed -and $directScmPassed) { 'success' } else { 'failure' }
          "lifecycle_result=$result" | Set-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Upload MSI lifecycle logs
        if: ${{ always() && steps.validate_inputs.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.validate_inputs.outputs.log_artifact_name }}
          path: ${{ runner.temp }}/snipespotter-msi-logs/*
          if-no-files-found: warn
