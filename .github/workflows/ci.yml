name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.filter.outputs.run_checks }}
      run_elevated: ${{ steps.filter.outputs.run_elevated }}
      force_all: ${{ steps.filter.outputs.force_all }}
      elevated_skip: ${{ steps.filter.outputs.run_elevated != 'true' && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            run_checks:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/**'
              - 'spotter-*/**'
              - 'scripts/**'
            run_elevated:
              - 'spotter-svc/**'
              - 'spotter-cli/**'
              - 'spotter-win32/**'
              - 'spotter-build/**'
              - 'installer/**'
              - 'scripts/test-msi-lifecycle.ps1'
              - 'scripts/TestSupport/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            force_all:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/**'

  checks:
    name: Reusable checks
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      run_checks: true
      force_all: ${{ needs.changes.outputs.force_all == 'true' }}

  elevated:
    name: Elevated Windows coverage
    needs: changes
    if: needs.changes.outputs.run_elevated == 'true'
    uses: ./.github/workflows/elevated-windows.yml
    with:
      source_artifact: true
      force: ${{ needs.changes.outputs.force_all == 'true' }}
      run_identity: ${{ github.run_id }}-${{ github.run_attempt }}
      log_artifact_name: elevated-windows-${{ github.run_id }}

  elevated_skip:
    name: Elevated Windows coverage skipped
    needs: changes
    if: needs.changes.outputs.run_elevated != 'true'
    runs-on: ubuntu-latest
    outputs:
      elevated_result: ${{ steps.result.outputs.elevated_result }}
    steps:
      - name: Publish successful explicit skip result
        id: result
        run: |
          set -euo pipefail
          printf '%s\n' 'Elevated Windows coverage skipped: no relevant paths changed.'
          printf 'elevated_result=skipped\n' >> "${GITHUB_OUTPUT}"

  ci-success:
    name: CI success
    if: always()
    needs: [changes, checks, elevated, elevated_skip]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks when applicable
        env:
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUN_ELEVATED: ${{ needs.changes.outputs.run_elevated }}
          ELEVATED_RESULT: ${{ needs.elevated.result }}
          ELEVATED_OUTPUT: ${{ needs.elevated.outputs.lifecycle_result }}
          ELEVATED_SKIP_RESULT: ${{ needs.elevated_skip.result }}
          ELEVATED_SKIP_OUTPUT: ${{ needs.elevated_skip.outputs.elevated_result }}
        run: |
          set -euo pipefail
          if [ "${RUN_CHECKS}" = "true" ]; then
            test "${CHECKS_RESULT}" = success
          fi
          if [ "${RUN_ELEVATED}" = "true" ]; then
            test "${ELEVATED_RESULT}" = success
            test "${ELEVATED_OUTPUT}" = success
          else
            test "${ELEVATED_SKIP_RESULT}" = success
            test "${ELEVATED_SKIP_OUTPUT}" = skipped
          fi
