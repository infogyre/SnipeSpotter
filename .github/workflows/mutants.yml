name: mutation tests

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-mutants:
    name: Core mutation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and assert Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustc --version | grep -Eq '^rustc 1\\.98\\.1 '
      - name: Install and assert cargo-mutants
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-mutants --version 27.1.0 --locked
          test "$(cargo mutants --version)" = 'cargo-mutants 27.1.0'
      - name: Run core mutation tests
        run: cargo mutants -p spotter-core --in-place --locked --timeout 120
