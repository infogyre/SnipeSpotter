[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Multiple versions arise from transitive platform-specific crates
# (windows-targets, windows_*_msvc, winnow) that we cannot control.
# These are build-time or target-specific and do not affect the runtime
# binary. Allow duplicates rather than blocking on transitive conflicts.
multiple-versions = "allow"
# Wildcard dependencies are workspace-internal path dependencies
# (spotter-core, spotter-win32, spotter-build) that inherit the workspace
# version. Allow them since they are not external registry dependencies.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
