[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# winnow 0.7.x is pulled by toml_edit 0.22 (toml 0.8) while winnow 1.0.x
# is pulled by toml_parser 1.x (toml 0.9, via embed-resource). Both are
# build-time/transitive only; skip the duplicate until upstream converges.
skip = [
    { name = "winnow", version = "0.7.15" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
