[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Keep dependency resolution finite and require every dependency version to be explicit.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# Final skip set for the cooldown-bumped TLS graph (verified 2026-09-10 on
# the Linux graph; Windows-target-only entries are marked in their reasons
# and checked on the Windows CI lane). Each entry names a real duplicate in
# the resolved lock with its actual compatibility path; re-verify after any
# dependency change.
[[bans.skip]]
name = "base64"
version = "=0.22.1"
reason = "hyper-util requires base64 0.22.1 while workspace crates use 0.23.1"

[[bans.skip]]
name = "getrandom"
version = "=0.3.3"
reason = "rand_core 0.9.5 retains getrandom 0.3.3 alongside workspace 0.4.3 (ring uses 0.2.17 on Windows targets)"

[[bans.skip]]
name = "getrandom"
version = "=0.2.17"
reason = "ring 0.17.14 uses getrandom 0.2.17 on Windows targets alongside 0.3.3/0.4.3"

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "getrandom 0.3.3 uses r-efi 5.3.0 on UEFI targets while getrandom 0.4.3 uses 6.0.0"

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "openssl-macros requires syn 2.0.119 while rcgen compatibility retains syn 3.0.3"

[[bans.skip]]
name = "wasi"
version = "=0.11.1+wasi-snapshot-preview1"
reason = "getrandom 0.2.17 (ring path, Windows targets only) retains wasi 0.11.1; needed for --target all on Windows runners, unused on Linux"

[[bans.skip]]
name = "windows-sys"
version = "=0.59.0"
reason = "rpassword and embed-resource require windows-sys 0.59.0 while current Windows dependencies use 0.61.2"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
