repos:
  - repo: local
    hooks:
      - id: powershell-lint
        name: PSScriptAnalyzer (lint)
        description: Lint PowerShell scripts using PSScriptAnalyzer
        entry: pwsh -NoProfile -File scripts/lint-powershell.ps1
        language: system
        files: \.ps1$
        types: [file]
        pass_filenames: true
