[workspace]
resolver = "2"
members = [
    "spotter-core",
    "spotter-win32",
    "spotter-build",
    "spotter-svc",
    "spotter-cli",
    "spotter-hardware-service",
]
default-members = ["spotter-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jake Wimmer"]

[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
embed-resource = "=3.0.11"
hmac = "=0.13.0"
sha2 = "=0.11.0"
subtle = "=2.6.1"
toml = "=1.1.5"
proptest = "=1.11.0"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls"] }
rpassword = "=7.5.4"
secrecy = "=0.10.3"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "net"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
wiremock = "=0.6.5"
wmi = "=0.18.4"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Security",
    "Storage",
    "System",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Services",
] }
windows-service = "=0.8.1"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(windows)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
format_push_string = "deny"

[profile.release]
debug = "limited"
